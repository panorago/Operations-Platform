name: Validate VENDA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run build:pages
      - run: npm run test:pages
      - name: Verify committed Pages output is current
        run: git diff --exit-code -- index.html assets .nojekyll
